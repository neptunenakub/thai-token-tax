# Where `ttt prices` reads official list prices, and which row belongs to which measured model.
# Only models this project measured (in full, or on a sample that matched a full run).
# A price is never typed here: this file only says where to look on the official page.
#
#   format         "markdown" = a Markdown table row, "gemini" = a model section of Google's page
#   rows           model id -> first cell of its row (markdown) or section id (gemini)
#   input_columns  header names that hold the standard input price (first one found wins)
#   start / end    optional text markers that bound the standard (non-batch) part of the page

[provider.anthropic]
url = "https://platform.claude.com/docs/en/about-claude/pricing.md"
format = "markdown"
input_columns = ["Base input tokens"]
output_columns = ["Output tokens"]

[provider.anthropic.rows]
"claude-opus-5-5" = "Claude Opus 5.5"
"claude-fable-5-2" = "Claude Fable 5.2"
"claude-sonnet-5-5" = "Claude Sonnet 5.5"
"claude-haiku-5-5" = "Claude Haiku 5.5 (for prompts up to 100,000 tokens)"
"claude-haiku-4-5-20251001" = "Claude Haiku 4.5"
"claude-sonnet-4-6" = "Claude Sonnet 4.6"

[provider.openai]
url = "https://developers.openai.com/api/docs/pricing.md"
format = "markdown"
start = "### Standard pricing data"
end = "### Batch pricing data"
input_columns = ["Short context input", "Input"]
output_columns = ["Short context output", "Output"]

[provider.openai.rows]
"gpt-6-astra" = "gpt-6-astra"
"gpt-6-sol" = "gpt-6-sol"
"gpt-6-luna" = "gpt-6-luna"
"gpt-6.1-sol" = "gpt-6.1-sol"
"gpt-6.1-terra" = "gpt-6.1-terra"
"gpt-5.6-sol" = "gpt-5.6-sol"
"gpt-5.5" = "gpt-5.5 (<272K context length)"
"gpt-5.4" = "gpt-5.4 (<272K context length)"
"gpt-5.2" = "gpt-5.2"

[provider.gemini]
url = "https://ai.google.dev/gemini-api/docs/pricing.md.txt"
format = "gemini"

[provider.gemini.rows]
"gemini-3.8-flash" = "gemini-3.8-flash"
"gemini-4-argon" = "gemini-4-argon"
"gemini-3.6-flash" = "gemini-3.6-flash"
"gemini-3.5-flash-lite" = "gemini-3.5-flash-lite"
"gemini-3.1-pro-preview" = "gemini-3.1-pro-preview"

# Bank of Thailand: the data file behind its "Daily Foreign Exchange Rates" page.
[exchange_rate]
what = "Bank of Thailand weighted-average interbank exchange rate, baht per US dollar"
page = "https://www.bot.or.th/en/statistics/exchange-rate.html"
url = "https://www.bot.or.th/content/bot/en/statistics/exchange-rate/jcr:content/root/container/statisticstable2.results.level3cache.json"
