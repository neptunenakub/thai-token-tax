# --- API sources ---------------------------------------------------------------------
# Counted through each provider's official token-counting endpoint (free of charge, see
# LOG.md day 2 for the documentation links). Model ids were read from the provider's
# official models page on 2026-11-10:
#   OpenAI     https://developers.openai.com/api/docs/models.md
#   Gemini     https://ai.google.dev/gemini-api/docs/models
#   Anthropic  https://platform.claude.com/docs/en/about-claude/models/overview
#              https://platform.claude.com/docs/en/about-claude/model-deprecations
#
#   sample_of  count only a fixed random sample of 100 sentence pairs and compare with the
#              named, fully measured model. If the sample agrees on every sentence the two
#              models share a tokenizer; if not, remove sample_of and measure it in full.

# Requests per minute this project allows itself per API source. Leave a source out for
# "no extra limit" (rate-limit errors are still retried with backoff).
# anthropic: this account's count_tokens limit is 100 per minute (response header
# anthropic-ratelimit-requests-limit, seen 2026-11-10).
[rate_limits]
anthropic = 90

