# Every tokenizer this benchmark measures. Adding a model = adding one [[model]] block.
#
#   id        what appears as model_id in the results
#   family    display group
#   counter   how it is counted: "tiktoken" (OpenAI encodings) or "hf" (Hugging Face tokenizer.json)
#   encoding  tiktoken only: the encoding name
#   revision  hf only, optional: repo commit to pin, so a rerun gives the same counts.
#             Leave it out to use the newest commit (the run records which one it used).
#   notes     optional, free text
#
# A model that cannot be downloaded is recorded as blocked in the results. It stays
# listed here so the gap is visible; it is never replaced by a mirror or a guess.

# OpenAI model ids as listed on the official models page. `ttt count` asks tiktoken which
# encoding each one maps to and saves the answer (null = this tiktoken version does not know it).
[openai_lookup]
models_page = "https://developers.openai.com/api/docs/models.md"
fetched = "2026-11-10"
model_ids = [
    "gpt-6-astra",
    "gpt-6-sol",
    "gpt-6-luna",
    "gpt-6.1-sol",
    "gpt-6.1-terra",
    "gpt-5.6-sol",
    "gpt-5.6-terra",
    "gpt-5.6-luna",
    "gpt-5.5",
    "gpt-5.5-pro",
    "gpt-5.4",
    "gpt-5.4-mini",
    "gpt-5.4-pro",
    "gpt-5.2",
    "gpt-5.2-pro",
    "gpt-oss-120b",
    "gpt-oss-20b",
    "gpt-4.1",
    "gpt-4o",
    "gpt-4o-mini",
    "gpt-4-turbo",
    "gpt-4",
    "gpt-3.5-turbo",
]

[[model]]
id = "tiktoken/o200k_base"
family = "OpenAI"
counter = "tiktoken"
encoding = "o200k_base"
notes = "GPT-4o to GPT-5.x per tiktoken 0.14.0. GPT-6 is not confirmed by any official source."

[[model]]
id = "tiktoken/cl100k_base"
family = "OpenAI"
counter = "tiktoken"
encoding = "cl100k_base"
notes = "GPT-4 and GPT-3.5 generation."

[[model]]
id = "tiktoken/o200k_harmony"
family = "OpenAI"
counter = "tiktoken"
encoding = "o200k_harmony"
notes = "gpt-oss open-weight models."

