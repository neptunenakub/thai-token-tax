# What the site shows, in words. No measurement lives here: every number on the site comes
# from results/ through `ttt site`. This file only names things and picks which models the
# headline talks about.
#
# [[group]]: a short name for a tokenizer group (all models that give identical token counts).
#   leader  the group's first fully measured model (the `same_counts_as` target in the summary)
#   en, th  the short name shown on the chart
#   named   model ids the short name mentions. `ttt site` stops if one of them is not in the
#           group, so a label can never claim a model the measurement does not support.
# A group without an entry here is shown under its leader's model id.

# Model families sold as pay-per-token APIs. A tokenizer group with a member from one of these
# families is drawn as "API"; the others are "open models only".
api_families = ["OpenAI", "Gemini", "Claude"]

[headline]
scenario = "line_oa_chatbot"
claude = "claude-opus-5-5"
gpt = "gpt-5.5"
gemini = "gemini-3.8-flash"
gemini_other = "gemini-4-argon"

# Short names of the four headline tokenizers: first screen of the site and the share card.
[headline.short]
claude = "Claude 5.5"
gpt = "GPT-5.x / 6"
gemini = "Gemini 3.x"
gemini_other = "Gemini 4"

# "More tokens is not always a higher bill": shown only if the numbers still say so.
[counterexample]
more_tokens = "claude-haiku-5-5"
fewer_tokens = "gemini-3.5-flash-lite"

# Two tokenizer generations of one vendor, for the note on why premiums of different models
# cannot be compared. Shown only if Thai stayed within 2% while English rose by more than 10%.
[generations]
older = "claude-haiku-4-5-20251001"
newer = "claude-opus-5-5"

# The group whose members include current Thai models (for the factual note under the chart).
[thai_models]
group = "Qwen/Qwen3-8B"

# Display names for API models. A model without an entry is shown by its id.
[names]
"claude-opus-5-5" = "Claude Opus 5.5"
"claude-fable-5-2" = "Claude Fable 5.2"
"claude-sonnet-5-5" = "Claude Sonnet 5.5"
"claude-haiku-5-5" = "Claude Haiku 5.5"
"claude-haiku-4-5-20251001" = "Claude Haiku 4.5"
"claude-sonnet-4-6" = "Claude Sonnet 4.6"
"gpt-6-astra" = "GPT-6 Astra"
"gpt-6-sol" = "GPT-6 Sol"
"gpt-6-luna" = "GPT-6 Luna"
"gpt-6.1-sol" = "GPT-6.1 Sol"
"gpt-6.1-terra" = "GPT-6.1 Terra"
"gpt-5.6-sol" = "GPT-5.6 Sol"
"gpt-5.5" = "GPT-5.5"
"gpt-5.4" = "GPT-5.4"
"gpt-5.2" = "GPT-5.2"
"gemini-4-argon" = "Gemini 4 Argon"
"gemini-3.8-flash" = "Gemini 3.8 Flash"
"gemini-3.6-flash" = "Gemini 3.6 Flash"
"gemini-3.5-flash-lite" = "Gemini 3.5 Flash-Lite"
"gemini-3.1-pro-preview" = "Gemini 3.1 Pro Preview"

# Licence names shown in the site footer and the README. The legal texts are the files
# LICENSE (code) and LICENSE-DATA (results and site text). `holder` is the copyright holder.
[licences]
code = "MIT"
results = "CC BY 4.0"
dataset = "CC BY-SA 4.0"
holder = "Thai Token Tax authors"

