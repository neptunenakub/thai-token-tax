# Publishes the static site in site/ to GitHub Pages.
#
# Written from the official guide (read 2026-11-10):
#   https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
# A workflow is needed because "deploy from a branch" can only serve the repository root
# or /docs, not site/:
#   https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
#
# Nothing is published until the repository owner (1) sets Settings > Pages > Source to
# "GitHub Actions" and (2) runs this workflow by hand. It has no push trigger on purpose:
# publishing is the owner's decision. Note that a Pages site is public even when the
# repository is private.
#
# site/data.json is generated by `ttt site` and committed; the test suite (ci.yml) fails if
# it no longer matches results/, so what gets published is what was measured.
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
