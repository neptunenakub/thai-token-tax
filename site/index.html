<script>
(() => {
"use strict";

/* CALC-START: the cost formula. It mirrors src/thai_token_tax/pricing.py and is checked
   against the published cost table, both in the test suite and every time the page loads. */
function scenarioChars(s) {
  let sent = 0, received = 0;
  for (let turn = 1; turn <= s.turns; turn++) {
    sent += s.system_chars + s.input_chars;
    if (s.resend_history) sent += (turn - 1) * (s.input_chars + s.output_chars);
    received += s.output_chars;
  }
  return { sent, received };
}
function estimateCost(s, rates, price, thbPerUsd, englishCharsPerThaiChar) {
  const chars = scenarioChars(s);
  const sent = chars.sent * s.units, received = chars.received * s.units;
  const tokens = (n, per1k) => n * per1k / 1000;
  const usd = (i, o) => (i * price.input_usd_per_mtok + o * price.output_usd_per_mtok) / 1e6;
  const one = (scale, per1k) => {
    const input = tokens(sent * scale, per1k), output = tokens(received * scale, per1k);
    return { input_tokens: input, output_tokens: output, usd: usd(input, output), thb: usd(input, output) * thbPerUsd };
  };
  return { thai: one(1, rates.thai), english: one(englishCharsPerThaiChar, rates.english) };
}
/* CALC-END */

// Text only. {placeholders} are filled from data.json; no measured number is written here.
const TEXT = {
  th: {
    skip: "ข้ามไปที่เนื้อหา",
    h1: "ราคาป้ายเท่ากัน แต่งานภาษาไทยบน Claude จ่ายแพงกว่า GPT <b>{ratio_price} เท่า</b>",
    kicker: "รายงานวัดผล: ต้นทุนของภาษาไทยบนโมเดล AI",
    deck: "ค่า API คิดตามจำนวน token และข้อความไทยเดียวกันใช้ token บน Claude มากกว่า GPT {ratio_gpt} เท่า มากกว่า Gemini 3.x {ratio_gemini} เท่า",
    money_cap: "ตัวอย่าง: {scenario} ราคาป้ายเท่ากันที่ {pin} / {pout} ดอลลาร์ต่อล้าน token (เข้า / ออก)",

// One row of a ranked bar list. `r` is the bar length as a share of the longest bar.
function barRow(opts) {
  const li = el("li");
  const row = el(opts.onclick ? "button" : "div", "row");
  const nm = el("span", "name");
  if (opts.onclick) { row.type = "button"; nm.append(el("span", "caret", "▸")); nm.firstChild.setAttribute("aria-hidden", "true"); }
  nm.append(document.createTextNode(opts.label));
  if (opts.sub) { nm.append(document.createTextNode(" ")); nm.append(el("small", null, opts.sub)); }
  const track = el("span", "track");
  const bar = el("span", "bar" + (opts.cls ? " " + opts.cls : ""));
  bar.style.setProperty("--r", String(opts.r));
  if (opts.one != null) { bar.classList.add("one"); bar.style.setProperty("--one", String(opts.one)); }
  const val = el("span", "val", opts.value);
  if (opts.valueSub) { val.append(document.createTextNode(" ")); val.append(el("small", null, opts.valueSub)); }
  track.append(bar, val);
  if (opts.tag) track.append(el("span", "tag", opts.tag));
  row.append(nm, track);
  li.append(row);
  if (opts.tip) attachTip(row, opts.tip);
  if (opts.onclick) row.addEventListener("click", () => opts.onclick(li, row));
  return li;
}

function attachTip(node, lines) {
  const tip = $("tip");
  const show = (x, y) => {
    tip.replaceChildren();
    lines().forEach(([value, label], i) => {
      const div = el("div");
      div.append(el(i === 0 ? "b" : "span", null, value), document.createTextNode(" " + label));
      tip.append(div);
    });
    tip.hidden = false;
    const w = tip.offsetWidth, hgt = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + "px";
    tip.style.top = Math.max(8, Math.min(y + 16, innerHeight - hgt - 8)) + "px";
  };
  node.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") show(e.clientX, e.clientY); });
  node.addEventListener("pointerleave", () => { tip.hidden = true; });
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); show(r.left + 24, r.bottom - 8); });
  node.addEventListener("blur", () => { tip.hidden = true; });
}

function renderTable() {

  head.replaceChildren(...COLUMNS.map((c) => {
    const th = el("th", c.n ? "n" : null), b = el("button", null, tx(c.label));

    if (state.sort.key === c.key) th.setAttribute("aria-sort", state.sort.dir > 0 ? "ascending" : "descending");
    b.addEventListener("click", () => {
      state.sort = { key: c.key, dir: state.sort.key === c.key ? -state.sort.dir : (c.n ? -1 : 1) };
      renderTable();
    });
    th.append(b);
    return th;
  }));
  const col = COLUMNS.find((c) => c.key === state.sort.key);
  const rows = D.models.map((m) => ({ m, g: m.group ? groupOf(m.group) : null }));
  rows.sort((a, b) => {
    const x = col.get(a.m, a.g), y = col.get(b.m, b.g);
    if (x == null || y == null) return (x == null) - (y == null);  // rows without a value go last
    return (x < y ? -1 : x > y ? 1 : 0) * state.sort.dir || a.m.model_id.localeCompare(b.m.model_id);

function selfCheck() {
  let n = 0;
  const bad = [];
  D.scenarios.forEach((s) => {
    Object.entries(D.costs[s.id] || {}).forEach(([id, expected]) => {
      const model = D.models.find((m) => m.model_id === id), c = costFor(model, s);
      n += 2;
      if (Math.abs(c.thai.thb - expected.thai_thb) > 1e-5) bad.push([s.id, id, "thai", c.thai.thb, expected.thai_thb]);
      if (Math.abs(c.english.thb - expected.english_thb) > 1e-5) bad.push([s.id, id, "english", c.english.thb, expected.english_thb]);
    });
  });
  window.__selfCheck = { checked: n, mismatches: bad };
  return window.__selfCheck;
}
function renderSelfCheck() {
  const c = window.__selfCheck, node = $("selfcheck");
  node.className = c.mismatches.length ? "small warnline" : "small";
  node.textContent = tx(c.mismatches.length ? "check_bad" : "check_ok", { n: num(c.checked), bad: num(c.mismatches.length) });
}

  $("f-preset").addEventListener("change", (e) => { state.scenario = e.target.value; loadPreset(); renderCalcControls(); renderCalcResult(); });
  $("f-model").addEventListener("change", (e) => { state.model = e.target.value; renderCalcResult(); });
  $("calc-form").addEventListener("input", (e) => { if (e.target.id !== "f-preset" && e.target.id !== "f-model") { readInputs(); renderCalcResult(); } });

  Promise.all([
    fetch("data.json").then((r) => { if (!r.ok) throw new Error("data.json " + r.status); return r.json(); }),
    fetch("config.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
  ]).then(([data, config]) => {
    D = data;
    CONFIG = Object.assign(CONFIG, config);
    state.scenario = D.headline.scenario;
    state.model = D.same_price_pairs[0].a;
    loadPreset();
    selfCheck();
    $("status").hidden = true;
    $("main").hidden = false;
    render();
  }).catch((err) => {
    $("status").textContent = TEXT.th.error + " / " + TEXT.en.error;
    console.error(err);
  });
}
start();
})();
</script>
</body>
</html>
